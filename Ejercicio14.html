
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>
<body>

<div class="contenedor">
    <h1>Operaciones con Lista de Números</h1>
    
    <label for="numerosInput">Ingrese números separados por comas:</label>
    <input type="text" id="numerosInput" placeholder="Ej. 10, 20, 30, 40, 50">

    <button id="btnCalcular">Calcular</button>

    <h3>Resultados:</h3>

    <label for="mayor">Número mayor:</label>
    <input type="text" id="mayor" readonly placeholder="Mayor">

    <label for="menor">Número menor:</label>
    <input type="text" id="menor" readonly placeholder="Menor">

    <label for="promedio">Promedio:</label>
    <input type="text" id="promedio" readonly placeholder="Promedio">
</div>

<script src="js/Ejercicio14.js"></script>

</body>

</html>
