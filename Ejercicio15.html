
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
</head>
<body>

<div class="contenedor">
    <h1>Registro de Estudiantes</h1>
    
    <label for="nombre">Nombre del estudiante:</label>
    <input type="text" id="nombre" placeholder="Ej. Ana">

    <label for="calificacion">Calificación:</label>
    <input type="number" id="calificacion" placeholder="Ej. 92" min="0" max="100">

    <button id="btnAgregar">Agregar estudiante</button>
    
    <p>Estudiantes agregados: <strong id="contador">0</strong></p>

    <hr>

    <button id="btnCalcular">Calcular</button>

    <h3>Resultados:</h3>

    <label for="promedio">Calificación promedio:</label>
    <input type="text" id="promedio" readonly placeholder="Promedio general">

    <label for="mejorEstudiante">Estudiante con calificación más alta:</label>
    <input type="text" id="mejorEstudiante" readonly placeholder="Mejor calificación">

    <label for="peorEstudiante">Estudiante con calificación más baja:</label>
    <input type="text" id="peorEstudiante" readonly placeholder="Menor calificación">
</div>

<script src="js/Ejercicio15.js"></script>

</body>

</html>
